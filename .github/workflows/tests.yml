name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Frozen-evidence tests verify blobs from mapped pre-split commits.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Test
        run: python -m pytest tests -q

  qualification:
    name: Package and evaluator qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Static analysis
        run: python -m ruff check analysis probes tests
      - name: Run deployment self-check
        run: ko-redteam-self-check --output self_check.json
      - name: Run public hygiene gate
        run: ko-redteam-check-public-hygiene --root . --output public_hygiene.json
      - name: Verify endpoint errors hard-fail with diagnostics
        run: |
          if ko-redteam-suite \
              --endpoint http://127.0.0.1:9/v1 \
              --model ci-unreachable-model \
              --benchmark benchmarks/ko_llm_mini_v1.json \
              --out-dir suite_error_ci \
              --timeout 1 \
              --multiturn \
              --agent-harness; then
            echo "endpoint-error suite unexpectedly passed" >&2
            exit 1
          fi
          python -c 'import json; report=json.load(open("suite_error_ci/suite_manifest.json", encoding="utf-8")); assert report["status"] == "fail"; assert report["summaries"]["measurement_integrity"]["endpoint_errors"] > 0'
      - name: Build distributions
        run: python -m build --sdist --wheel
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/ko-redteam-wheel
          /tmp/ko-redteam-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/ko-redteam-wheel/bin/python -c "import importlib.metadata as m; from analysis.ko_llm_forensics import analyze_response; assert m.version('ko-redteam') == '1.0.0'; assert callable(analyze_response)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ko-redteam-qualification
          path: |
            dist/*
            self_check.json
            public_hygiene.json
            suite_error_ci/suite_manifest.json
            suite_error_ci/suite_report.md
            suite_error_ci/report_doctor.json

  container:
    name: Hardened container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build runtime
        run: docker build --target runtime --build-arg VCS_REF="${GITHUB_SHA}" -t ko-redteam:ci .
      - name: Run runtime self-check
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --cap-drop ALL --security-opt no-new-privileges
          ko-redteam:ci
      - name: Verify minimal non-root runtime
        run: |
          docker run --rm --entrypoint python ko-redteam:ci -c \
            'import importlib.util,json,os; assert os.getuid() == 10001; assert importlib.util.find_spec("pytest") is None; assert importlib.util.find_spec("pip") is None; assert importlib.util.find_spec("tarfile") is None; assert importlib.util.find_spec("sqlite3") is None; report=json.load(open("/usr/local/share/ko-guard/runtime-hardening.json")); assert report["status"] == "pass"'
      - name: Build and run test stage
        run: |
          docker build --target test -t ko-redteam:test .
          docker run --rm ko-redteam:test
