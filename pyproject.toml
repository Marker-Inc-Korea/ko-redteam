[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-redteam"
version = "0.1.0"
description = "Korean LLM redteam and forensics toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marker Inc Korea" }]
keywords = ["korean", "llm", "redteam", "forensics", "safety", "privacy", "agent", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2"]

[project.scripts]
ko-redteam-self-check = "probes.self_check:main"
ko-redteam-suite = "probes.run_suite:main"
ko-redteam-check-endpoint = "probes.check_endpoint:main"
ko-redteam-check-public-hygiene = "probes.check_public_hygiene:main"
ko-redteam-scan = "probes.scan:main"
ko-redteam-benchmark = "probes.benchmark_scan:main"
ko-redteam-multiturn = "probes.multiturn_benchmark:main"
ko-redteam-agent-harness = "probes.agent_harness:main"
ko-redteam-validate-benchmarks = "probes.validate_benchmarks:main"
ko-redteam-check-coverage = "probes.check_benchmark_coverage:main"
ko-redteam-import-benchmark = "probes.import_benchmark:main"
ko-redteam-merge-benchmarks = "probes.merge_benchmarks:main"
ko-redteam-expand-benchmark = "probes.expand_benchmark:main"
ko-redteam-analyze-responses = "probes.analyze_responses:main"
ko-redteam-analyze-repeats = "probes.analyze_repeats:main"
ko-redteam-rank-models = "probes.rank_models:main"
ko-redteam-validate-leaderboard = "probes.validate_leaderboard:main"
ko-redteam-build-calibration = "probes.build_calibration:main"
ko-redteam-audit-splits = "probes.audit_splits:main"
ko-redteam-analyze-power = "probes.analyze_power:main"
ko-redteam-compare-reports = "probes.compare_reports:main"
ko-redteam-check-regression = "probes.check_regression:main"
ko-redteam-gate-reports = "probes.gate_reports:main"
ko-redteam-doctor-reports = "probes.doctor_reports:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis*", "benchmarks*", "detectors*", "gap_analysis*", "governance*", "probes*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
benchmarks = ["*.json", "*.md"]
gap_analysis = ["*.md", "_vendor/*"]
governance = ["*.md"]
probes = ["ko_jailbreak_templates.json"]

[tool.setuptools.exclude-package-data]
detectors = [".gitignore"]
probes = [".gitignore"]

[tool.pytest.ini_options]
pythonpath = ["analysis", "probes", "detectors"]
testpaths = ["tests"]
