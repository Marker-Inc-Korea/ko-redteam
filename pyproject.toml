[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-redteam"
version = "0.2.0rc13"
description = "Korean LLM redteam and forensics toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marker Inc Korea" }]
keywords = ["korean", "llm", "redteam", "forensics", "safety", "privacy", "agent", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2"]
semantic = [
    "torch>=2.6,<3",
    "transformers>=4.48,<6",
    "tokenizers>=0.21,<1",
    "huggingface-hub>=0.28,<2",
]

[project.scripts]
ko-redteam-self-check = "probes.self_check:main"
ko-redteam-suite = "probes.run_suite:main"
ko-redteam-check-endpoint = "probes.check_endpoint:main"
ko-redteam-check-public-hygiene = "probes.check_public_hygiene:main"
ko-redteam-scan = "probes.scan:main"
ko-redteam-benchmark = "probes.benchmark_scan:main"
ko-redteam-multiturn = "probes.multiturn_benchmark:main"
ko-redteam-agent-harness = "probes.agent_harness:main"
ko-redteam-validate-benchmarks = "probes.validate_benchmarks:main"
ko-redteam-check-coverage = "probes.check_benchmark_coverage:main"
ko-redteam-import-benchmark = "probes.import_benchmark:main"
ko-redteam-merge-benchmarks = "probes.merge_benchmarks:main"
ko-redteam-expand-benchmark = "probes.expand_benchmark:main"
ko-redteam-analyze-responses = "probes.analyze_responses:main"
ko-redteam-analyze-repeats = "probes.analyze_repeats:main"
ko-redteam-build-ranking-manifest = "probes.build_ranking_manifest:main"
ko-redteam-rank-models = "probes.rank_models:main"
ko-redteam-validate-leaderboard = "probes.validate_leaderboard:main"
ko-redteam-build-calibration = "probes.build_calibration:main"
ko-redteam-build-calibration-commitments = "probes.build_calibration_commitments:main"
ko-redteam-verify-calibration-signatures = "probes.verify_calibration_signatures:main"
ko-redteam-calibration-collection = "probes.calibration_collection:main"
ko-redteam-calibration-response = "probes.calibration_response:main"
ko-redteam-build-power-pilot = "probes.build_power_pilot:main"
ko-redteam-build-review-packets = "probes.build_review_packets:main"
ko-redteam-review-handoff = "probes.review_handoff:main"
ko-redteam-review-response = "probes.review_response:main"
ko-redteam-build-review-commitment = "probes.build_review_commitment:main"
ko-redteam-merge-review-responses = "probes.merge_review_responses:main"
ko-redteam-verify-review-signatures = "probes.verify_review_signatures:main"
ko-redteam-build-external-review-statement = "probes.build_external_review_statement:main"
ko-redteam-assemble-external-review = "probes.assemble_external_review:main"
ko-redteam-verify-external-review = "probes.verify_external_review:main"
ko-redteam-build-pilot-registration = "probes.build_pilot_registration:main"
ko-redteam-validate-pilot-registration = "probes.validate_pilot_registration:main"
ko-redteam-preflight-pilot-execution = "probes.preflight_pilot_execution:main"
ko-redteam-audit-splits = "probes.audit_splits:main"
ko-redteam-semantic-embeddings = "probes.semantic_embeddings:main"
ko-redteam-analyze-power = "probes.analyze_power:main"
ko-redteam-analyze-familywise-power = "probes.analyze_familywise_power:main"
ko-redteam-build-power-design = "probes.build_power_design:main"
ko-redteam-build-season-preregistration = "probes.build_season_preregistration:main"
ko-redteam-validate-season-preregistration = "probes.validate_season_preregistration:main"
ko-redteam-build-release-manifest = "probes.build_release_manifest:main"
ko-redteam-publish-leaderboard = "probes.build_leaderboard_site:main"
ko-redteam-verify-publication = "probes.verify_leaderboard_site:main"
ko-redteam-compare-reports = "probes.compare_reports:main"
ko-redteam-check-regression = "probes.check_regression:main"
ko-redteam-gate-reports = "probes.gate_reports:main"
ko-redteam-doctor-reports = "probes.doctor_reports:main"
ko-redteam-validate-deployment = "probes.validate_deployment:main"
ko-redteam-check-revalidation = "probes.check_revalidation:main"
ko-redteam-check-cohort-design = "probes.check_cohort_design:main"
ko-redteam-check-policy-invariance = "probes.check_policy_invariance:main"
ko-redteam-validate-model-selection = "probes.validate_model_selection:main"
ko-redteam-runtime-lock = "probes.runtime_lock:main"
ko-redteam-analyze-deployment-matrix = "probes.analyze_deployment_matrix:main"
ko-redteam-validate-mfds-deployment = "probes.validate_mfds_deployment:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis*", "benchmarks*", "detectors*", "gap_analysis*", "governance*", "probes*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
benchmarks = ["*.json", "*.md"]
gap_analysis = ["*.md", "_vendor/*"]
governance = ["*.md", "*.json"]
probes = ["ko_jailbreak_templates.json"]

[tool.setuptools.exclude-package-data]
detectors = [".gitignore"]
probes = [".gitignore"]

[tool.pytest.ini_options]
pythonpath = ["analysis", "probes", "detectors"]
testpaths = ["tests"]
